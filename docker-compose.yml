services:
  legacy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legacy-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Paris
      ALTHERYA_BRIDGE_TOKEN: ${ALTHERYA_BRIDGE_TOKEN}
      ALTHERYA_BRIDGE_HOST: 0.0.0.0
      ALTHERYA_BRIDGE_PORT: 8787
    volumes:
      - legacy_data:/app/data

volumes:
  legacy_data:
